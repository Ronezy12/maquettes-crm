:root{--bg:#F5F5F7;--surface:#FFFFFF;--fill:#F0F0F3;--fill-2:#F7F7F9;--line:#E5E5EA;--line-strong:#D2D2D7;--ink:#1D1D1F;--ink-2:#3A3A3C;--muted:#6E6E73;--tint:#E8EDFD;--primary:#1D3FBF;--wa:#1A7F45;--ok:#1C6B3D}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4C6EF0;outline-offset:2px}
.sel{border:0;background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}

.lab{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.mini{border:0;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.card{background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.card:hover{box-shadow:0 0 0 1px var(--line-strong),0 6px 16px rgba(0,0,0,.06)}
.card:active{cursor:grabbing}
@keyframes arFlash{from{background-color:#FFE9A8}}
@keyframes arPop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes arShrink{from{width:100%}to{width:0}}
@keyframes arSheet{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
