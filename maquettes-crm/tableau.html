<style>
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:#1D3FBF}a:hover{color:#142C8A}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
input::placeholder,textarea::placeholder{color:var(--muted)}
.btn{border:0;background: var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:0 0 0 1px var(--line-strong);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--fill-2)}
.pri{border:0;background:#1D3FBF;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pri:hover{background:#1835A3}
.dan{border:0;background:#C5221F;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
.fld{border:0;background: var(--surface);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);box-shadow:0 0 0 1px var(--line-strong);min-width:0}
.th{position:sticky;top:0;z-index:1;background:var(--fill-2);font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.td{padding:0 12px;border-bottom:1px solid var(--fill);font-size:13px;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th2{position:sticky;top:39px;z-index:1;background:var(--fill-2);padding:6px 8px 8px 12px;border-bottom:1px solid var(--line);text-align:left}
.cf{width:100%;box-sizing:border-box;border:0;border-radius:6px;padding:5px 8px;font-size:12px;box-shadow:0 0 0 1px var(--line);outline:none}
.cf:focus{box-shadow:0 0 0 2px #1D3FBF}
.rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:2}
.rz{background:linear-gradient(var(--line-strong),var(--line-strong)) center/1px 50% no-repeat}
.rz:hover{background:linear-gradient(#1D3FBF,#1D3FBF) center/3px 70% no-repeat}
.grip{cursor:grab;color:#48484A;font-size:14px;font-weight:700;letter-spacing:-3px;line-height:1;padding:3px 6px 3px 3px;margin-left:-4px;border-radius:5px;user-select:none;flex-shrink:0}
.grip:hover{background: var(--inverse);color:#FFFFFF}
.grip:active{cursor:grabbing}
.cellb{border:0;background:transparent;padding:4px 6px;margin-left:-6px;border-radius:6px;text-align:left;width:calc(100% + 6px);font-size:13px;cursor:text}
.cellb:hover{background:var(--fill);box-shadow:0 0 0 1px var(--line)}
.celli{width:100%;box-sizing:border-box;border:0;border-radius:6px;padding:6px 8px;font-size:13px;box-shadow:0 0 0 2px #1D3FBF;outline:none;background: var(--surface)}
.cellsel{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:4px 6px;margin-left:-6px;border-radius:6px;font-size:13px;cursor:pointer;max-width:100%}
.cellsel:hover{background:var(--fill)}
.tbl:focus{outline:none;box-shadow:0 0 0 2px #1D3FBF !important}
.ib{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.ib:hover{background:var(--line);color:#1D3FBF}
.sortb{border:0;background:transparent;padding:0;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
.sortb:hover{color:var(--ink)}
.mi{border:0;background:transparent;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px}
.mi:hover{background:#1D3FBF;color:#fff}
.side{border:0;text-align:left;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;font-size:13px;width:100%}
.lab{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.statsel{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:4px 24px 4px 10px;font-size:12px;font-weight:600;cursor:pointer;background-repeat:no-repeat;background-position:right 8px center;background-size:8px 5px}
.pop{position:absolute;z-index:8;background: var(--surface);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.16),0 0 0 1px var(--line)}
tr.r:hover td{background:var(--fill-2)}
:root{--bg:#F5F5F7;--surface:#FFFFFF;--fill:#F0F0F3;--fill-2:#F7F7F9;--line:#E5E5EA;--line-strong:#D2D2D7;--ink:#1D1D1F;--ink-2:#3A3A3C;--muted:#6E6E73;--tint:#E8EDFD;--inverse:#1D1D1F;--primary:#1D3FBF;--accent:#FFC93C}
.ar-dark{--bg:#0F0F11;--surface:#1C1C1E;--fill:#2C2C2E;--fill-2:#242426;--line:#38383A;--line-strong:#48484A;--ink:#F5F5F7;--ink-2:#D1D1D6;--muted:#A1A1A6;--tint:#1E2A55;--inverse:#3A3A3C;color-scheme:dark}
.ar-dark select,.ar-dark input,.ar-dark textarea{color:var(--ink)}
.ar-dark option{background:#1C1C1E;color:#F5F5F7}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #4C6EF0;outline-offset:2px}
@keyframes arFlash{from{background-color:#FFE9A8}}
@keyframes arShimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--fill) 0,var(--fill-2) 50%,var(--fill) 100%);background-size:800px 100%;animation:arShimmer 1.1s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@keyframes arShrink{from{width:100%}to{width:0}}
@keyframes arSlide{0%{margin-left:-35%}100%{margin-left:100%}}
@keyframes arSpin{to{transform:rotate(360deg)}}
@keyframes arPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes arColFromL{from{transform:translateX(-60px);opacity:.35}to{transform:none;opacity:1}}
@keyframes arColFromR{from{transform:translateX(60px);opacity:.35}to{transform:none;opacity:1}}
@keyframes arSheet{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes arFade{from{opacity:0}to{opacity:1}}
</style>
<style>
#ar-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(29,29,31,.92);box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
#ar-switch a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px}
#ar-switch a[aria-current]{background:#FFC93C;color:#1D1D1F}
#ar-switch a:focus-visible{outline:3px solid #4C6EF0;outline-offset:2px}
#ar-demo{position:fixed;right:16px;bottom:16px;z-index:50;font:600 11px -apple-system,system-ui,sans-serif;color:#6E6E73;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 10px;box-shadow:0 0 0 1px #E5E5EA}
</style>

      modalSend: s.modal === 'send', modalDelete: s.modal === 'delete', closeModal: () => this.setState({ modal: null }),
      channels: ['mail', 'sms', 'wa'].map(c => Object.assign({ label: CH[c], on: s.ch === c, pick: () => { const t = TPL[c][s.tpl]; this.setState({ ch: c, subject: t[0], body: t[1] }); } }, seg(s.ch === c))),
      recipientList: allTargets.map(r => { const on = !s.excluded[r.id]; return { name: r.name, sub: s.ch === 'mail' ? (r.email || 'e-mail manquant') : r.phone, subColor: s.ch === 'mail' && !r.email ? '#B25E00' : 'var(--muted)', on, opacity: on ? '1' : '.45',
        toggle: () => { const ex = Object.assign({}, this.state.excluded); if (ex[r.id]) delete ex[r.id]; else ex[r.id] = true; this.setState({ excluded: ex }); } }; }),
      recipientCount: targets.length + ' / ' + allTargets.length,
      tplButtons: Object.keys(TPL.mail).map(t => ({ label: t, bg: s.tpl === t ? '#1D3FBF' : 'var(--surface)', fg: s.tpl === t ? '#FFFFFF' : 'var(--ink)', ring: s.tpl === t ? '#1D3FBF' : 'var(--line)',
        pick: () => { const x = TPL[s.ch][t]; this.setState({ tpl: t, subject: x[0], body: x[1] }); } })),
      inserts: [['Prénom', '{Prénom}'], ['Nom', '{Nom}'], ['Ville', '{Ville}'], ['N° fiche', '{N° fiche}'], ['Lien avis Google', ' [LIEN AVIS]'], ['Lien du devis', ' [LIEN DEVIS]'], ['Tél. bureau', ' 09 74 36 52 17'], ['Signature', '\nAharon – Entreprise AR']]
        .map(v => ({ label: v[0], insert: () => this.setState({ body: this.state.body + v[1] }) })),
      schedule: s.schedule, onSchedule: e => this.setState({ schedule: e.target.value }),
      sendTest: () => this.notify('Test envoyé sur ton numéro / ta boîte (maquette)', null),
      saveTpl: () => this.notify('Modèle enregistré (maquette)', null),
      attach: () => this.notify('Pièce jointe ajoutée (maquette)', null),
      chIcon: s.ch === 'mail' ? 'Mail' : s.ch === 'sms' ? 'SMS' : 'WhatsApp',
      tplOptions: Object.keys(TPL.mail), sendTpl: s.tpl,
      onTpl: e => { const t = TPL[s.ch][e.target.value]; this.setState({ tpl: e.target.value, subject: t[0], body: t[1] }); },
      isMail: s.ch === 'mail', isSms: s.ch === 'sms', sendSubject: s.subject, sendBody: s.body,
      onSubject: e => this.setState({ subject: e.target.value }), onBody: e => this.setState({ body: e.target.value }),
      vars: ['{Prénom}', '{Nom}', '{Ville}', '{N° fiche}'].map(v => ({ label: v, insert: () => this.setState({ body: this.state.body + v }) })),
      smsInfo: smsLen + ' caractères · ' + smsParts + ' SMS', smsColor: smsParts > 1 ? '#B25E00' : 'var(--muted)',
      previewName: first ? first.name : '', preview: first ? fill(s.body) : '',
      sendBtn: (s.schedule === 'now' ? 'Envoyer' : 'Programmer') + ' (' + targets.length + ')',
      doSend: () => { const k = s.ch === 'mail' ? 'mails' : s.ch; const ids = targets.map(r => r.id);
        this.patch(ids, o => { const p = {}; p[k] = (o[k] || 0) + 1; return p; }, CH[s.ch] + ' envoyé à ' + ids.length + (ids.length > 1 ? ' prospects' : ' prospect') + ' (maquette)', false);
        this.setState({ modal: null }); },
      deleteTitle: 'Supprimer ' + targets.length + (targets.length > 1 ? ' prospects ?' : ' prospect ?'),
      deleteNames: targets.slice(0, 5).map(r => r.name).join(', ') + (targets.length > 5 ? '…' : ''),
      doDelete: () => { const ids = targets.map(r => r.id);
        this.patch(ids, () => ({ deleted: true }), ids.length + (ids.length > 1 ? ' prospects supprimés' : ' prospect supprimé'));
        this.setState({ modal: null, sel: {} }); }
    };
  }
}

ARMount(Component);
</script>
