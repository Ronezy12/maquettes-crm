<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F5F5F7}
:root{--bg:#F5F5F7;--surface:#FFFFFF;--fill:#F0F0F3;--fill-2:#F7F7F9;--line:#E5E5EA;--line-strong:#D2D2D7;--ink:#1D1D1F;--ink-2:#3A3A3C;--muted:#6E6E73;--tint:#E8EDFD;--primary:#1D3FBF;--wa:#1A7F45;--danger:#C5221F;--warn:#B25E00;--ok:#1C6B3D}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:var(--primary)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #4C6EF0;outline-offset:2px}
.sel{border:0;background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}
.btn{border:0;background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:0 0 0 1px var(--line-strong);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.lab{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.nav{border:0;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink)}
.nav:hover{background:var(--fill)}
.item{border:0;width:100%;text-align:left;background:var(--surface);padding:12px 14px 12px 12px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.item:hover{background:var(--fill-2)}
.res{border:0;border-radius:12px;padding:14px 10px;font-size:14px;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;justify-content:center}
.res:hover{filter:brightness(1.08)}
.kbd{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);border-radius:5px;padding:1px 6px}
.chip{border:0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
@keyframes arIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes arPop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes arShrink{from{width:100%}to{width:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<style>
#ar-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(29,29,31,.92);box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
#ar-switch a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px}
#ar-switch a[aria-current]{background:#FFC93C;color:#1D1D1F}
#ar-switch a:focus-visible{outline:3px solid #4C6EF0;outline-offset:2px}
#ar-demo{position:fixed;right:16px;bottom:16px;z-index:50;font:600 11px -apple-system,system-ui,sans-serif;color:#6E6E73;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 10px;box-shadow:0 0 0 1px #E5E5EA}
</style>

const NOW = '2026-11-03';
