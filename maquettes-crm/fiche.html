<style>
body{margin:0;background:#F5F5F7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}
a{color:#1D3FBF}a:hover{color:#142C8A}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
input::placeholder,textarea::placeholder{color:#6E6E73}
.btn{border:0;background:#fff;color:#1D1D1F;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:0 0 0 1px #D2D2D7;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:#F7F7F9}
.pri{border:0;background:#1D3FBF;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pri:hover{background:#1835A3}
.card{background:#fff;border-radius:14px;box-shadow:0 0 0 1px #E5E5EA}
.lab{font-size:11px;font-weight:700;color:#6E6E73;letter-spacing:.05em;text-transform:uppercase}
.fld{border:0;background:#fff;border-radius:8px;padding:7px 9px;font-size:13px;color:#1D1D1F;box-shadow:0 0 0 2px #1D3FBF;outline:none;width:100%;box-sizing:border-box}
.fv{border:0;background:transparent;text-align:left;width:100%;padding:5px 8px;margin:0 -8px;border-radius:7px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:text}
.fv:hover{background:#F2F2F5}
.fv .pen{opacity:0;margin-left:auto;color:#6E6E73}
.fv:hover .pen{opacity:1}
.qa{border:0;background:#F2F2F5;color:#1D1D1F;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.qa:hover{background:#E8E8ED}
.mi{border:0;background:transparent;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:#1D1D1F}
.mi:hover{background:#1D3FBF;color:#fff}
.tab{border:0;background:transparent;padding:12px 4px;margin-right:18px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
:root{--c-primary:#1D3FBF;--c-primary-dark:#142C8A;--c-accent:#FFC93C;--c-ink:#1D1D1F;--c-muted:#6E6E73;--c-line:#E5E5EA;--c-bg:#F5F5F7;--c-success:#1C6B3D;--c-danger:#C5221F;--c-wa:#1A7F45;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--shadow-md:0 14px 36px rgba(0,0,0,.16)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--c-primary);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
.sticky{position:sticky;top:0;z-index:6}
.req{color:var(--c-danger);font-weight:800}
.sug{border:0;background:#fff;width:100%;text-align:left;padding:8px 10px;font-size:13px;border-radius:6px;cursor:pointer}
.sug:hover{background:#EEF2FD}
@keyframes arSpin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:arSpin .7s linear infinite;vertical-align:-2px;margin-right:6px}
.mention{color:var(--c-primary);font-weight:700;background:#EEF2FD;border-radius:4px;padding:0 3px}
@keyframes arPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes arShrink{from{width:100%}to{width:0}}
@keyframes arFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#ar-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(29,29,31,.92);box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
#ar-switch a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px}
#ar-switch a[aria-current]{background:#FFC93C;color:#1D1D1F}
#ar-switch a:focus-visible{outline:3px solid #4C6EF0;outline-offset:2px}
#ar-demo{position:fixed;right:16px;bottom:16px;z-index:50;font:600 11px -apple-system,system-ui,sans-serif;color:#6E6E73;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 10px;box-shadow:0 0 0 1px #E5E5EA}
@media (max-width:640px){#ar-switch{left:8px;right:8px;overflow-x:auto}#ar-demo{display:none}}
</style>
